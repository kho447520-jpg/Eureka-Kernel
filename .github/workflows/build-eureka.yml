name: Build NguyenKhanhHau Kernel
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Clone Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git /home/runner/proton-clang

      - name: Build Kernel
        run: |
          export PATH="/home/runner/proton-clang/bin:$PATH"
          chmod +x build.sh
          # Sử dụng tham số từ script build gốc, ví dụ 'auto ems'
          # Bạn nên xem NOTES.md để chọn đúng tham số cho thiết bị của mình
          ./build.sh auto ems

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: NguyenKhanhHau-Kernel
          path: kernel_zip/*.zip
