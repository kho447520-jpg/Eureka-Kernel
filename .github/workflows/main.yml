name: Add KernelSU-Next v3.3.0 to Kernel Sources (A10/A20/A30/A30s/A40)

on:
  workflow_dispatch:

env:
  KERNEL_BRANCH: R24U

jobs:
  add-ksu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - exynos7885-a10_defconfig
          - exynos7885-a20_defconfig
          - exynos7885-a30_defconfig
          - exynos7885-a30s_defconfig
          - exynos7885-a40_defconfig

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: kho447520-jpg/Eureka-Kernel
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0

      - name: Set Git user
        working-directory: ./kernel
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # 1. Tải KernelSU-Next v3.3.0 (Legacy)
      - name: Setup KernelSUNext
        working-directory: ./kernel
        run: |
          echo "=== Đang tải KernelSU-Next v3.3.0 từ nhánh legacy ==="
          rm -rf KernelSU
          git clone --depth=1 -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          cd KernelSU
          git fetch --depth=1 origin tag v3.3.0
          git checkout v3.3.0
          cd ..
          
          if [ -f "KernelSU/Makefile" ] || [ -f "KernelSU/kernel/Makefile" ]; then
            echo "✅ Đã tải KernelSU-Next v3.3.0 (legacy) thành công!"
          else
            echo "❌ LỖI: Không tìm thấy Makefile trong thư mục KernelSU!"
            ls -la KernelSU/
            exit 1
          fi

      # 2. Cấu hình KSU vào defconfig của từng thiết bị
      - name: Enable KernelSU in defconfig
        working-directory: ./kernel
        run: |
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/${{ matrix.defconfig }}
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/${{ matrix.defconfig }}
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ matrix.defconfig }}
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/${{ matrix.defconfig }}
          echo "# CONFIG_KPROBES is not set" >> arch/arm64/configs/${{ matrix.defconfig }}
          echo "# CONFIG_HAVE_KPROBES is not set" >> arch/arm64/configs/${{ matrix.defconfig }}
          echo "# CONFIG_KPROBES_EVENTS is not set" >> arch/arm64/configs/${{ matrix.defconfig }}
          tail -10 arch/arm64/configs/${{ matrix.defconfig }}

      # 3. Lưu thay đổi lại (nếu bạn muốn commit lên nhánh)
      - name: Commit changes
        working-directory: ./kernel
        run: |
          git add -A
          git commit -m "Add KernelSU-Next v3.3.0 to ${{ matrix.defconfig }}"
          # Bạn có thể push lên nhánh nếu cần:
          # git push origin ${{ env.KERNEL_BRANCH }}

      - name: Done
        run: |
          echo "✅ Đã thêm KernelSU-Next v3.3.0 vào source cho ${{ matrix.defconfig }}!"