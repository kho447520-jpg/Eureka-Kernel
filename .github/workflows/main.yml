name: Build Kernels (Haubai) - A10/A20/A30/A30s/A40

on:
  workflow_dispatch:
  push:
    branches: [ R24U ]

env:
  KERNEL_BRANCH: R24U
  LOCALVERSION_STR: "-p6-HaubaiKernel"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - exynos7885-a10_defconfig
          - exynos7885-a20_defconfig
          - exynos7885-a30_defconfig
          - exynos7885-a30s_defconfig
          - exynos7885-a40_defconfig

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: kho447520-jpg/Eureka-Kernel
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Set Git user
        working-directory: ./kernel
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # 1. KernelSU-Next v1.1.1
      - name: Setup KernelSUNext
        working-directory: ./kernel
        run: |
          rm -rf KernelSU
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.1.1

      # 2. Cấu hình KSU + LOCALVERSION vào defconfig
      - name: Enable KernelSU + HaubaiKernel version in defconfig
        working-directory: ./kernel
        run: |
          DEFCONFIG=arch/arm64/configs/${{ matrix.defconfig }}
          # Xoá các dòng cũ (tránh duplicate khi rerun)
          sed -i '/CONFIG_KSU/d;/CONFIG_KALLSYMS/d;/CONFIG_KPROBES/d;/CONFIG_LOCALVERSION/d' "$DEFCONFIG"
          {
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "# CONFIG_KPROBES is not set"
            echo "# CONFIG_HAVE_KPROBES is not set"
            echo "# CONFIG_KPROBES_EVENTS is not set"
            echo "CONFIG_LOCALVERSION=\"${{ env.LOCALVERSION_STR }}\""
            echo "CONFIG_LOCALVERSION_AUTO=n"
          } >> "$DEFCONFIG"
          tail -12 "$DEFCONFIG"

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio \
                              gcc-aarch64-linux-gnu zip rsync

      # 3. Setup Neutron Clang (có verify)
      - name: Setup Neutron Clang
        run: |
          mkdir -p toolchain
          cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          if [ -d "toolchain/bin" ]; then
            echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH
          else
            NEUTRON_BIN=$(find toolchain -maxdepth 3 -type d -name bin | head -n1)
            echo "$(pwd)/${NEUTRON_BIN}" >> $GITHUB_PATH
          fi
          find toolchain -maxdepth 2 -type d | head -20

      - name: Verify toolchain
        run: |
          which clang || true
          clang --version || true
          which ld.lld || true

      - name: Set environment
        run: |
          {
            echo "CC=clang"
            echo "LD=ld.lld"
            echo "AR=llvm-ar"
            echo "NM=llvm-nm"
            echo "OBJCOPY=llvm-objcopy"
            echo "OBJDUMP=llvm-objdump"
            echo "STRIP=llvm-strip"
            echo "CROSS_COMPILE=aarch64-linux-gnu-"
            echo "ARCH=arm64"
          } >> $GITHUB_ENV

      - name: Configure kernel
        working-directory: ./kernel
        run: |
          export PLATFORM_VERSION=11
          export ANDROID_MAJOR_VERSION=r
          make O=out ARCH=arm64 ${{ matrix.defconfig }}
          make O=out ARCH=arm64 olddefconfig

      # 4. Build kernel — ép LOCALVERSION bằng biến make để chắc chắn ghi đè
      - name: Build kernel
        shell: bash
        working-directory: ./kernel
        run: |
          set -o pipefail
          export PLATFORM_VERSION=11
          export ANDROID_MAJOR_VERSION=r
          make -j$(nproc) O=out ARCH=arm64 \
            LOCALVERSION="${{ env.LOCALVERSION_STR }}" \
            CC=${CC} LD=${LD} AR=${AR} NM=${NM} \
            OBJCOPY=${OBJCOPY} OBJDUMP=${OBJDUMP} STRIP=${STRIP} \
            CROSS_COMPILE=${CROSS_COMPILE} 2>&1 | tee build.log

      # 5. Verify version string thực tế
      - name: Verify kernel version
        run: |
          echo "=== CONFIG_LOCALVERSION trong out/.config ==="
          grep CONFIG_LOCALVERSION kernel/out/.config || true
          echo "=== Version string trong Image ==="
          strings kernel/out/arch/arm64/boot/Image* 2>/dev/null | grep -m1 "Linux version" || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.defconfig }}
          path: kernel/build.log

      - name: Prepare AnyKernel
        run: |
          if [ -d kernel/kernel_zip/anykernel ]; then
            cp -r kernel/kernel_zip/anykernel anykernel
          else
            echo "❌ Không tìm thấy kernel_zip/anykernel, liệt kê:"
            ls kernel/kernel_zip || true
            exit 1
          fi

      # 6. Copy kernel image (fallback chính xác)
      - name: Copy kernel image
        run: |
          set -e
          SRC=""
          for f in Image.gz-dtb Image.gz Image; do
            if [ -f "kernel/out/arch/arm64/boot/$f" ]; then
              SRC="kernel/out/arch/arm64/boot/$f"
              break
            fi
          done
          if [ -z "$SRC" ]; then
            echo "❌ Không tìm thấy kernel image!"
            ls -la kernel/out/arch/arm64/boot/ || true
            exit 1
          fi
          echo "✅ Dùng: $SRC"
          cp "$SRC" anykernel/
          ls -la anykernel/

      - name: Create flashable zip
        run: |
          cd anykernel
          DEVICE=$(echo "${{ matrix.defconfig }}" | sed 's/exynos7885-//;s/_defconfig//')
          ZIP_NAME="Haubai_${DEVICE}_${KERNEL_BRANCH}.zip"
          echo "📦 Tạo: $ZIP_NAME"
          zip -r9 "../$ZIP_NAME" *
          cd ..

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Haubai_${{ matrix.defconfig }}
          path: Haubai_*.zip
          if-no-files-found: error