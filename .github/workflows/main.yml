name: Build Haubai_A10 + KernelSU-Next v1.1.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  KERNEL_BRANCH: main
  KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
  KSU_REF: v1.1.1

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0

      - name: Set Git user
        working-directory: ./kernel
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Purge old KernelSU
        working-directory: ./kernel
        run: |
          if [ -e "KernelSU" ]; then git rm -rf KernelSU; fi
          if [ -e "KernelSU-Next" ]; then git rm -rf KernelSU-Next; fi
          if [ -f ".gitmodules" ] && grep -q 'submodule "KernelSU' .gitmodules; then
            git config --file .gitmodules --remove-section submodule.KernelSU 2>/dev/null || true
            git config --file .gitmodules --remove-section submodule.KernelSU-Next 2>/dev/null || true
            git add .gitmodules
          fi
          git add -A
          git commit -m "Purge KernelSU before build" || echo "No changes"

      - name: Add KernelSU-Next v1.1.1
        working-directory: ./kernel
        run: |
          git submodule add ${{ env.KSU_REPO }} KernelSU-Next
          cd KernelSU-Next
          git fetch --tags --depth=1 origin ${{ env.KSU_REF }} || git fetch --tags
          git checkout ${{ env.KSU_REF }}
          git log --oneline -1
          cd ..

      - name: Run KernelSU-Next setup
        working-directory: ./kernel
        run: |
          chmod +x KernelSU-Next/kernel/setup.sh
          ./KernelSU-Next/kernel/setup.sh

      - name: Enable KernelSU-Next in defconfig (Manual Hook)
        working-directory: ./kernel
        run: |
          DEFCONFIG=arch/arm64/configs/exynos7885-a10_defconfig

          echo "CONFIG_KALLSYMS=y"                 >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y"             >> $DEFCONFIG
          echo "CONFIG_KSU=y"                      >> $DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y"          >> $DEFCONFIG
          echo "# CONFIG_KPROBES is not set"       >> $DEFCONFIG
          echo "# CONFIG_HAVE_KPROBES is not set"  >> $DEFCONFIG
          echo "# CONFIG_KPROBE_EVENTS is not set" >> $DEFCONFIG
          echo "# CONFIG_LTO_CLANG is not set"     >> $DEFCONFIG
          echo "CONFIG_SIPHASH=y"                  >> $DEFCONFIG

          tail -15 $DEFCONFIG

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio gcc-aarch64-linux-gnu

      - name: Setup Neutron Clang
        run: |
          mkdir -p toolchain && cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Set environment
        run: |
          {
            echo "CC=clang"
            echo "LD=ld.lld"
            echo "AR=llvm-ar"
            echo "NM=llvm-nm"
            echo "OBJCOPY=llvm-objcopy"
            echo "OBJDUMP=llvm-objdump"
            echo "STRIP=llvm-strip"
            echo "CROSS_COMPILE=aarch64-linux-gnu-"
            echo "ARCH=arm64"
          } >> $GITHUB_ENV

      - name: Configure kernel
        working-directory: ./kernel
        run: |
          make O=out ARCH=arm64 exynos7885-a10_defconfig

      - name: Verify KernelSU-Next config
        working-directory: ./kernel
        run: |
          grep -q "CONFIG_KSU=y" out/.config || { echo "KernelSU-Next not enabled!"; exit 1; }
          grep -q "CONFIG_KALLSYMS_ALL=y" out/.config || { echo "KALLSYMS_ALL missing!"; exit 1; }

      - name: Build kernel
        working-directory: ./kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC=${CC} LD=${LD} AR=${AR} NM=${NM} \
            OBJCOPY=${OBJCOPY} OBJDUMP=${OBJDUMP} STRIP=${STRIP} \
            CROSS_COMPILE=${CROSS_COMPILE} 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: anykernel

      - name: Copy kernel image
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/ 2>/dev/null || \
          cp kernel/out/arch/arm64/boot/Image.gz      anykernel/ 2>/dev/null || \
          cp kernel/out/arch/arm64/boot/Image         anykernel/

      - name: Create flashable zip
        run: |
          cd anykernel
          zip -r9 ../Haubai_A10.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Haubai_A10
          path: Haubai_A10.zip