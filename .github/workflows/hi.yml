name: Build R15-OneUI + BPF merge from R24U (A10)

on:
  workflow_dispatch:
  push:
    branches: [ R15-OneUI ]

env:
  KERNEL_BRANCH: R15-OneUI
  MERGE_FROM_BRANCH: R24U

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0

      - name: Set Git user
        working-directory: ./kernel
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # Remove any existing KernelSU to avoid submodule conflicts
      - name: Purge KernelSU
        working-directory: ./kernel
        run: |
          if [ -e "KernelSU" ]; then
            git rm -rf KernelSU
          fi
          if [ -f ".gitmodules" ] && grep -q 'submodule "KernelSU"' .gitmodules; then
            git config --file .gitmodules --remove-section submodule.KernelSU 2>/dev/null || true
            git add .gitmodules
          fi
          git add -A
          git commit -m "Purge KernelSU before merge" || echo "No changes"

      # Merge R24U with auto-resolution (favor R24U on conflicts)
      - name: Merge R24U into R15-OneUI
        working-directory: ./kernel
        run: |
          git remote add upstream https://github.com/${{ github.repository }}.git || true
          git fetch upstream ${{ env.MERGE_FROM_BRANCH }}
          git merge --no-ff upstream/${{ env.MERGE_FROM_BRANCH }} -X theirs -m "Merge ${{ env.MERGE_FROM_BRANCH }} for BPF"

      # Add KernelSU-Next v3.3.0 (Legacy)
      - name: Add KernelSU-Next v3.3.0
        working-directory: ./kernel
        run: |
          git submodule add https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next
          git fetch --depth=1 origin tag v3.3.0
          git checkout v3.3.0
          cd ..

      - name: Run KernelSU-Next setup
        working-directory: ./kernel
        run: |
          chmod +x KernelSU-Next/kernel/setup.sh
          ./KernelSU-Next/kernel/setup.sh

      - name: Enable KernelSU in defconfig (A10)
        working-directory: ./kernel
        run: |
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/exynos7885-a10_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/exynos7885-a10_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/exynos7885-a10_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/exynos7885-a10_defconfig
          echo "# CONFIG_KPROBES is not set" >> arch/arm64/configs/exynos7885-a10_defconfig
          echo "# CONFIG_HAVE_KPROBES is not set" >> arch/arm64/configs/exynos7885-a10_defconfig
          echo "# CONFIG_KPROBES_EVENTS is not set" >> arch/arm64/configs/exynos7885-a10_defconfig
          echo "# CONFIG_LTO_CLANG is not set" >> arch/arm64/configs/exynos7885-a10_defconfig
          echo "CONFIG_SIPHASH=y" >> arch/arm64/configs/exynos7885-a10_defconfig
          tail -10 arch/arm64/configs/exynos7885-a10_defconfig

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio gcc-aarch64-linux-gnu

      - name: Setup Neutron Clang
        run: |
          mkdir -p toolchain
          cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Set environment
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV

      - name: Configure kernel (A10)
        working-directory: ./kernel
        run: |
          make O=out ARCH=arm64 exynos7885-a10_defconfig

      - name: Verify KernelSU config
        working-directory: ./kernel
        run: |
          grep -q "CONFIG_KSU=y" out/.config || (echo "KernelSU not enabled!" && exit 1)
          grep -q "CONFIG_KSU_MANUAL_HOOK=y" out/.config || (echo "Manual hook not enabled!" && exit 1)

      - name: Build kernel (A10)
        working-directory: ./kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC=${CC} LD=${LD} AR=${AR} NM=${NM} \
            OBJCOPY=${OBJCOPY} OBJDUMP=${OBJDUMP} STRIP=${STRIP} \
            CROSS_COMPILE=${CROSS_COMPILE} 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-a10
          path: kernel/build.log

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: anykernel

      - name: Copy kernel image
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/ || \
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/ || \
          cp kernel/out/arch/arm64/boot/Image anykernel/

      - name: Create flashable zip
        run: |
          cd anykernel
          zip -r9 ../Haubai_A10.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Haubai_A10
          path: Haubai_A10.zip