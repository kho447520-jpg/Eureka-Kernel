name: Build Eureka Kernel Android 13 + KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1. Tải mã nguồn Eureka Kernel (Nhánh R24U cho Android 13)
    - name: Checkout Eureka Source
      uses: actions/checkout@v4
      with:
        repository: eurekadevelopment/Eureka-Kernel-Exynos7885-Q-R-S
        ref: R24U
        path: kernel-source

    # 2. Tải Trình biên dịch Vortex Clang
    - name: Checkout Vortex Clang Toolchain
      uses: actions/checkout@v4
      with:
        repository: eurekadevelopment/Vortex-Clang
        path: vortex-clang

    # 3. Cài đặt các gói công cụ phụ thuộc bắt buộc
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git ccache automake flex lzop bison build-essential zip curl zlib1g-dev libssl-dev libelf-dev bc ncurses-dev libncurses5-dev libncursesw5-dev squashfs-tools

    # 4. Tích hợp trực tiếp mã nguồn KernelSU Next vào Kernel Tree
    - name: Integrate KernelSU Next
      run: |
        cd $GITHUB_WORKSPACE/kernel-source
        
        # Tải mã nguồn của kịch bản cài đặt nhanh từ KernelSU Next
        curl -LSs "https://githubusercontent.com" | bash -s next
        
        # Ép cấu hình bật mặc định các tính năng của KernelSU vào file defconfig
        echo "CONFIG_KSU=y" >> arch/arm64/configs/exynos7885_defconfig
        echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/exynos7885_defconfig

    # 5. Tiến hành biên dịch Kernel
    - name: Build Kernel Binary
      run: |
        cd $GITHUB_WORKSPACE/kernel-source
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH=$GITHUB_WORKSPACE/vortex-clang/bin
        export PATH=$CLANG_PATH:$PATH
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        make clean && make mrproper
        make exynos7885_defconfig
        make CC=clang HOSTCC=clang-14 LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump -j$(nproc)

    # 6. Đóng gói xuất file Kernel đầu ra lên GitHub để tải về
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Eureka-Kernel-A13-KernelSU-Next
        path: kernel-source/arch/arm64/boot/Image.gz-dtb
